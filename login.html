!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIMS · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0a1f3d;
    --navy-mid:#12305a;
    --sky:#4fa8e0;
    --sky-light:#eaf4fc;
    --sky-pale:#f4f9fd;
    --white:#ffffff;
    --ink:#16233b;
    --muted:#5c7290;
    --border:#dce8f4;
    --danger:#e0574f;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;font-family:'Inter',sans-serif;}
  body{
    background:linear-gradient(150deg,var(--navy-deep) 0%,var(--navy-mid) 45%,var(--sky) 130%);
    display:flex;align-items:center;justify-content:center;padding:24px;color:var(--ink);
  }
  .wrap{display:flex;width:100%;max-width:920px;background:var(--white);border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(6,16,33,0.35);}
  .brand-side{
    flex:1;background:radial-gradient(circle at 30% 20%,#1a3a68,var(--navy-deep) 70%);
    color:#fff;padding:44px 38px;display:flex;flex-direction:column;justify-content:space-between;
    min-width:270px;
  }
  .brand-side h1{font-family:'Poppins';font-size:30px;font-weight:800;display:flex;align-items:center;gap:10px;}
  .brand-side h1 .dot{width:12px;height:12px;border-radius:50%;background:var(--sky);box-shadow:0 0 0 5px rgba(79,168,224,0.28);}
  .brand-side p.tag{font-size:12.5px;letter-spacing:0.5px;color:#b9d3ec;margin-top:2px;font-weight:600;}
  .brand-side .pitch{margin-top:36px;font-size:15px;line-height:1.7;color:#d7e6f5;}
  .brand-side .pitch strong{color:#fff;}
  .brand-side .foot{font-size:12px;color:#8fb0d3;}
  .form-side{flex:1.15;padding:44px 40px;display:flex;flex-direction:column;min-width:300px;}
  .tabs{display:flex;gap:6px;background:var(--sky-light);border-radius:10px;padding:4px;margin-bottom:26px;}
  .tab-btn{flex:1;padding:10px 0;border-radius:8px;font-weight:700;font-size:13.5px;color:var(--muted);transition:.15s;}
  .tab-btn.active{background:var(--navy-deep);color:#fff;}
  .form-panel{display:none;flex-direction:column;gap:14px;}
  .form-panel.active{display:flex;}
  label{font-size:12.5px;font-weight:700;color:var(--navy-deep);margin-bottom:5px;display:block;}
  .field input{
    width:100%;padding:11px 14px;border-radius:9px;border:1.5px solid var(--border);
    font-size:14px;outline:none;transition:border-color .15s;background:var(--sky-pale);
  }
  .field input:focus{border-color:var(--sky);}
  .field{margin-bottom:2px;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .avatar-picker{display:flex;gap:10px;flex-wrap:wrap;margin-top:2px;}
  .avatar-opt{width:44px;height:44px;border-radius:50%;overflow:hidden;border:3px solid transparent;cursor:pointer;transition:.15s;}
  .avatar-opt img{width:100%;height:100%;object-fit:cover;display:block;}
  .avatar-opt.selected{border-color:var(--sky);}
  .btn{
    margin-top:8px;padding:12px 0;border-radius:10px;border:none;font-weight:700;font-size:14.5px;
    background:var(--navy-deep);color:#fff;cursor:pointer;transition:filter .15s,transform .15s;
  }
  .btn:hover{filter:brightness(1.18);}
  .btn:disabled{background:#b7c6da;cursor:not-allowed;}
  .btn-link{background:none;color:var(--sky);font-weight:600;font-size:12.5px;text-align:right;padding:0;margin-top:-6px;}
  .btn-link:hover{text-decoration:underline;}
  .msg{font-size:12.5px;border-radius:8px;padding:9px 12px;display:none;}
  .msg.show{display:block;}
  .msg.error{background:#fdeceb;color:var(--danger);}
  .msg.success{background:#e9f8ef;color:#1f8f52;}
  .spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,0.4);border-top-color:#fff;display:inline-block;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (max-width:720px){.wrap{flex-direction:column;}.brand-side{min-width:auto;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand-side">
    <div>
      <h1><span class="dot"></span>DRIMS</h1>
      <p class="tag">GRADE 11 FRIEND BASE</p>
      <p class="pitch">One place for our grade to <strong>post</strong>, <strong>share memes</strong>, drop <strong>photos &amp; videos</strong>, and keep the group chat alive — plus private DMs for just-us conversations.</p>
    </div>
    <p class="foot">Built by grade 11, for grade 11. 💙</p>
  </div>
  <div class="form-side">
    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Log In</button>
      <button class="tab-btn" data-tab="signup">Sign Up</button>
    </div>
    <div id="msgBox" class="msg"></div>
    <!-- LOG IN -->
    <form class="form-panel active" id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="button" class="btn-link" id="forgotBtn">Forgot password?</button>
      <button type="submit" class="btn" id="loginBtn">Log In</button>
    </form>
    <!-- SIGN UP -->
    <form class="form-panel" id="signupForm">
      <div class="field">
        <label>Full name</label>
        <input type="text" id="suName" placeholder="e.g. Lindiwe Mokoena" required>
      </div>
      <div class="row2">
        <div class="field">
          <label>Class</label>
          <input type="text" id="suClass" placeholder="e.g. 11-A" value="Grade 11">
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" id="suEmail" placeholder="you@example.com" required autocomplete="email">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label>Password</label>
          <input type="password" id="suPassword" placeholder="min. 6 characters" required autocomplete="new-password">
        </div>
        <div class="field">
          <label>Confirm password</label>
          <input type="password" id="suConfirm" placeholder="repeat password" required autocomplete="new-password">
        </div>
      </div>
      <div class="field">
        <label>Pick an avatar</label>
        <div class="avatar-picker" id="avatarPicker"></div>
      </div>
      <button type="submit" class="btn" id="signupBtn">Create Account</button>
    </form>
  </div>
</div>
